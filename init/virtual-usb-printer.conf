description     "Virtual USB multi-function printer"
author          "chromium-os-dev@chromium.org"

# This job has no start or stop conditions because it should
# only be started manually.

import CFGDIR
import USB_DESCRIPTORS
import IPP_ATTRIBUTES
import ESCL_CAPS
import RECORD_DOC
import SCAN_DOC
import OUTPUT_LOG_DIR
import MOCK_PRINTER_SCRIPT
import VMODULE
env CFGDIR="/usr/local/etc/virtual-usb-printer"
env USB_DESCRIPTORS
env IPP_ATTRIBUTES
env ESCL_CAPS
env RECORD_DOC
env SCAN_DOC
env OUTPUT_LOG_DIR
env MOCK_PRINTER_SCRIPT
env VMODULE

# virtual-usb-printer can't recover by restarting, but it is only used by tests.
# If the system needs memory then it shouldn't be more important than Chrome.
oom score 0

pre-start script
  vid=$(printf "%04x" $(grep -s idVendor "${CFGDIR}/${USB_DESCRIPTORS}" | \
                        awk '{print $2}' | tr -d -c '[0-9]'))
  pid=$(printf "%04x" $(grep -s idProduct "${CFGDIR}/${USB_DESCRIPTORS}" | \
                        awk '{print $2}' | tr -d -c '[0-9]'))
  if [ "$vid" = "0000" ] || [ "$pid" = "0000" ]; then
    stop
    exit 1
  fi

  if ! modprobe -a usbip_core vhci-hcd ; then
    stop
    exit 1
  fi
end script

post-stop script
  modprobe -r -a vhci-hcd usbip_core
end script

post-start script
  # Wait for virtual-usb-printer to be listening
  # before trying to attach to it.
  tries=0
  while [ "$tries" -lt "20" ]; do
    pid=$(lsof -t -i tcp:3240 -a -c virtual-usbip)
    if [ -n "$pid" ]; then
      break
    fi
    sleep 0.1
    tries=$((tries + 1))
  done
  if [ -z "$pid" ]; then
    stop
    exit 1
  fi

  usbip attach -r localhost -d 1-1

  # Wait for the USB device to appear before
  # telling the caller we're done.
  vid=$(printf "%04x" $(grep idVendor "${CFGDIR}/${USB_DESCRIPTORS}" | \
                        awk '{print $2}' | tr -d -c '[0-9]'))
  pid=$(printf "%04x" $(grep idProduct "${CFGDIR}/${USB_DESCRIPTORS}" | \
                        awk '{print $2}' | tr -d -c '[0-9]'))
  tries=0
  while [ "$tries" -lt "50" ]; do
    dev=$(lsusb -d "$vid:$pid" | tr -d '\n')
    if [ -n "$dev" ]; then
      break
    fi
    sleep 0.1
    tries=$((tries + 1))
  done
  if [ -z "$dev" ]; then
    stop
    exit 1
  fi
end script

exec /usr/local/bin/virtual-usb-printer.sh \
    ${USB_DESCRIPTORS:+--descriptors_path=${CFGDIR}/}${USB_DESCRIPTORS} \
    ${IPP_ATTRIBUTES:+--attributes_path=${CFGDIR}/}${IPP_ATTRIBUTES} \
    ${ESCL_CAPS:+--scanner_capabilities_path=${CFGDIR}/}${ESCL_CAPS} \
    ${RECORD_DOC:+--record_doc=}${RECORD_DOC} \
    ${SCAN_DOC:+--scanner_doc_path=}${SCAN_DOC} \
    ${OUTPUT_LOG_DIR:+--output_log_dir=}${OUTPUT_LOG_DIR} \
    ${MOCK_PRINTER_SCRIPT:+--mock_printer_script=}${MOCK_PRINTER_SCRIPT} \
    ${VMODULE:+--vmodule=}${VMODULE}
