// These messages provide a Protobuf representation of HTTP messages.

syntax = "proto3";

package mocking;

// Matches the properties of an HTTP message.
message HttpProperties {
  // Defined in RFC 7231, section 6.1.
  enum StatusCode {
    UNSPECIFIED = 0;
    INTERNAL_SERVER_ERROR = 500;
  }

  StatusCode status_code = 1;
}
